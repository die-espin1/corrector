<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrector</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }

  /* Botones de esquina: totalmente invisibles, sin borde, sin texto */
  .corner-btn {
    position: absolute;
    width: 180px;
    height: 180px;
    background: transparent;
    border: none;
    outline: none;
    cursor: default;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  #btn-1 { top: 0;    left: 0; }   /* esquina superior izquierda */
  #btn-2 { top: 0;    right: 0; }  /* esquina superior derecha  */
  #btn-3 { bottom: 0; left: 0; }   /* esquina inferior izquierda */
  #btn-4 { bottom: 0; right: 0; }  /* esquina inferior derecha  */

  /* Input diminuto, casi imperceptible, arriba en el centro */
  #secret-input {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    min-width: 8px;
    max-width: 8px;
    height: 10px;
    min-height: 10px;
    max-height: 10px;
    line-height: 10px;
    padding: 0;
    margin: 0;
    border: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    background: transparent;
    outline: none;
    box-shadow: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    font-size: 8px;
    font-family: monospace;
    color: transparent;
    caret-color: transparent;
    text-align: center;
    pointer-events: none;
    overflow: hidden;
    box-sizing: border-box;
  }
  #secret-input:focus,
  #secret-input:focus-visible {
    outline: none;
    box-shadow: none;
  }
  #secret-input.enabled {
    pointer-events: auto;
    color: rgba(0, 0, 0, 0.25);
    caret-color: rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>

  <button class="corner-btn" id="btn-1" data-num="1" aria-hidden="true" tabindex="-1"></button>
  <button class="corner-btn" id="btn-2" data-num="2" aria-hidden="true" tabindex="-1"></button>
  <button class="corner-btn" id="btn-3" data-num="3" aria-hidden="true" tabindex="-1"></button>
  <button class="corner-btn" id="btn-4" data-num="4" aria-hidden="true" tabindex="-1"></button>

  <input
    type="text"
    id="secret-input"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    disabled
  />

  <script src="app.js"></script>
</body>
</html>
